<!DOCTYPE html>
<html lang='en'>
<head>
<title> CATopalian JS Checkout Pipeline </title>

<meta charset = 'UTF-8'>
<meta name = 'viewport' content = 'width = device-width, initial-scale = 1.0'>

<style>

body
{
    background-color: rgb(30, 30, 30);
    font-family: Arial;
    font-size: 20px;
    font-weight: bold;
    color: rgb(255, 255, 255);
    margin: 24px;
    max-width: 580px;
}

input[type='text'], input[type='number']
{
    display: block;
    width: 240px;
    background-color: rgb(20, 20, 20);
    color: rgb(255, 255, 255);
    border: 2px solid rgb(0, 255, 255);
    font-family: Arial;
    font-size: 20px;
    font-weight: bold;
    padding: 8px;
    margin-top: 4px;
    margin-bottom: 14px;
}

input[type='checkbox']
{
    width: 20px;
    height: 20px;
    margin-right: 10px;
    cursor: pointer;
}

hr
{
    border: 1px solid rgb(80, 80, 80);
    margin: 18px 0px;
}

.itemRow
{
    display: flex;
    align-items: center;
    margin-bottom: 8px;
}

.stationCard
{
    background-color: rgb(20, 20, 20);
    border-left: 4px solid rgb(0, 255, 255);
    padding: 10px 14px;
    margin-bottom: 12px;
}

</style>

<script>

// ===
// shortcuts.js
// ===
function ge(whichId)
{
    let result = document.getElementById(whichId);
    return result;
}

function ce(whichType)
{
    let result = document.createElement(whichType);
    return result;
}

function ba(whichElement)
{
    let result = document.body.append(whichElement);
    return result;
}

function cl(whichText)
{
    let result = console.log(whichText);
    return result;
}

function ct(whichText)
{
    let result = document.createTextNode(whichText);
    return result;
}

//----//

// ===
// CATALOG DATA
// ===
let catalogItems = [
    { name: 'Mechanical Keyboard', price: 80, qty: 1, defaultChecked: true },
    { name: 'USB-C Hub',           price: 35, qty: 1, defaultChecked: true },
    { name: 'Braided Cable',       price: 15, qty: 2, defaultChecked: true },
    { name: 'Desk Mat',            price: 25, qty: 1, defaultChecked: false }
];

//----//

// ===
// LOGIC LAYER (100% Pure Input -> Output — Zero DOM references)
// ===

// STATION 1: INPUT: array of item objects | OUTPUT: raw subtotal number
function calculateSubtotal(whichItems)
{
    if (whichItems.length === 0)
    {
        return 0;
    }

    let total = 0;

    for (let i = 0; i < whichItems.length; i++)
    {
        let lineTotal = whichItems[i].price * whichItems[i].qty;
        total = total + lineTotal;
    }

    return total;
}

// STATION 2: INPUT: subtotal + promo string | OUTPUT: discounted number
function applyPromoDiscount(whichSubtotal, whichPromoCode)
{
    if (whichSubtotal <= 0)
    {
        return 0;
    }

    let cleanCode = whichPromoCode.trim().toUpperCase();

    if (cleanCode === 'SAVE10')
    {
        return whichSubtotal * 0.90;
    }

    if (cleanCode === 'SAVE20')
    {
        return whichSubtotal * 0.80;
    }

    // No matching promo code: pass subtotal through unchanged
    return whichSubtotal;
}

// STATION 3: INPUT: discounted amount + tax % | OUTPUT: total with tax
function addSalesTax(whichAmount, whichTaxPercent)
{
    if (whichAmount <= 0)
    {
        return 0;
    }

    if (whichTaxPercent <= 0)
    {
        return whichAmount;
    }

    let taxAmount = whichAmount * (whichTaxPercent / 100);
    return whichAmount + taxAmount;
}

// STATION 4: INPUT: raw final number | OUTPUT: formatted "$0.00" string
function formatCurrency(whichAmount)
{
    if (whichAmount <= 0)
    {
        return '$0.00';
    }

    return '$' + whichAmount.toFixed(2);
}

//----//

// ===
// INTERFACE LAYER (Simple Vertical DOM Elements — Zero innerHTML)
// ===
function makeItemChecklist(whichCatalog)
{
    let sectionTitle = ce('div');
    sectionTitle.textContent = 'Select Cart Items:';
    sectionTitle.style.marginBottom = '10px';
    ba(sectionTitle);

    for (let i = 0; i < whichCatalog.length; i++)
    {
        let item = whichCatalog[i];

        let row = ce('div');
        row.className = 'itemRow';

        let checkbox = ce('input');
        checkbox.type = 'checkbox';
        checkbox.id = 'itemCheck_' + i;
        checkbox.checked = item.defaultChecked;
        checkbox.onchange = function()
        {
            runCheckoutPipeline();
        };
        row.append(checkbox);

        let label = ce('span');
        label.textContent = item.name + ' ($' + item.price + ' x ' + item.qty + ')';
        row.append(label);

        ba(row);
    }
}

function makeInputRow(whichLabelText, whichId, whichType, whichDefaultValue)
{
    let label = ce('div');
    label.textContent = whichLabelText;
    label.style.marginTop = '12px';
    ba(label);

    let box = ce('input');
    box.id = whichId;
    box.type = whichType;
    box.value = whichDefaultValue;
    box.oninput = function()
    {
        runCheckoutPipeline();
    };
    ba(box);
}

function makeStationCard(whichId, isFinal)
{
    let card = ce('div');
    card.id = whichId;
    card.className = 'stationCard';

    if (isFinal)
    {
        card.style.borderLeftColor = 'rgb(0, 255, 0)';
    }

    ba(card);
}

function getSelectedItems(whichCatalog)
{
    let selected = [];

    for (let i = 0; i < whichCatalog.length; i++)
    {
        let box = ge('itemCheck_' + i);

        if (box && box.checked)
        {
            selected.push(whichCatalog[i]);
        }
    }

    return selected;
}

function makeInterface()
{
    let title = ce('div');
    title.textContent = 'Shopping Cart Checkout Pipeline';
    title.style.fontSize = '24px';
    title.style.marginBottom = '16px';
    ba(title);

    makeItemChecklist(catalogItems);

    makeInputRow('Promo Code (try SAVE10 or SAVE20):', 'promoInput', 'text', 'SAVE10');
    makeInputRow('Sales Tax (%):', 'taxInput', 'number', '8');

    let divider = ce('hr');
    ba(divider);

    makeStationCard('station1Out', false);
    makeStationCard('station2Out', false);
    makeStationCard('station3Out', false);
    makeStationCard('station4Out', true);
}

//----//

// ===
// ORCHESTRATOR
// ===
function runCheckoutPipeline()
{
    // 1. Gather raw inputs from the interface
    let selectedItems = getSelectedItems(catalogItems);
    let promoCode = ge('promoInput').value;
    let taxPercent = Number(ge('taxInput').value);

    // 2. Run the 4 pure conveyor belt stations
    let subtotal = calculateSubtotal(selectedItems);
    let afterDiscount = applyPromoDiscount(subtotal, promoCode);
    let afterTax = addSalesTax(afterDiscount, taxPercent);
    let finalPrice = formatCurrency(afterTax);

    // 3. Display each station's output cleanly
    ge('station1Out').textContent = 'Station 1 (Subtotal): $' + subtotal.toFixed(2);
    ge('station2Out').textContent = 'Station 2 (After Promo): $' + afterDiscount.toFixed(2);
    ge('station3Out').textContent = 'Station 3 (After Tax): $' + afterTax.toFixed(2);
    ge('station4Out').textContent = 'Station 4 (Final Total): ' + finalPrice;
}

function whenLoaded()
{
    makeInterface();
    runCheckoutPipeline();
}

</script>

</head>

<body onload = 'whenLoaded();'>

</body>

</html>
