<!DOCTYPE html>
<html lang='en'>
<head>
<title> CATopalian JS Password Pipeline </title>

<meta charset = 'UTF-8'>
<meta name = 'viewport' content = 'width = device-width, initial-scale = 1.0'>

<style>

body
{
    background-color: rgb(30, 30, 30);
    font-family: Arial;
    font-size: 20px;
    font-weight: bold;
    color: rgb(255, 255, 255);
    margin: 24px;
    max-width: 640px;
}

input[type='text']
{
    display: block;
    width: 340px;
    background-color: rgb(20, 20, 20);
    color: rgb(255, 255, 255);
    border: 2px solid rgb(0, 255, 255);
    font-family: Arial;
    font-size: 22px;
    font-weight: bold;
    padding: 8px;
    margin-top: 6px;
    margin-bottom: 14px;
}

hr
{
    border: 1px solid rgb(80, 80, 80);
    margin: 18px 0px;
}

.stationCard
{
    background-color: rgb(20, 20, 20);
    border-left: 4px solid rgb(0, 255, 255);
    padding: 10px 14px;
    margin-bottom: 12px;
}

</style>

<script>

// ===
// shortcuts.js
// ===
function ge(whichId)
{
    let result = document.getElementById(whichId);
    return result;
}

function ce(whichType)
{
    let result = document.createElement(whichType);
    return result;
}

function ba(whichElement)
{
    let result = document.body.append(whichElement);
    return result;
}

function cl(whichText)
{
    let result = console.log(whichText);
    return result;
}

function ct(whichText)
{
    let result = document.createTextNode(whichText);
    return result;
}

//----//

// ===
// LOGIC LAYER (100% Pure Input -> Output — Zero DOM references)
// ===

// STATION 1: INPUT: raw password string | OUTPUT: object of 5 boolean rule checks
function inspectPasswordRules(whichPassword)
{
    if (whichPassword === '')
    {
        return {
            hasMinLength: false,
            hasUpper: false,
            hasLower: false,
            hasNumber: false,
            hasSymbol: false
        };
    }

    let checks = {
        hasMinLength: whichPassword.length >= 8,
        hasUpper: /[A-Z]/.test(whichPassword),
        hasLower: /[a-z]/.test(whichPassword),
        hasNumber: /[0-9]/.test(whichPassword),
        hasSymbol: /[^A-Za-z0-9]/.test(whichPassword)
    };

    return checks;
}

// STATION 2: INPUT: rule checks object | OUTPUT: numeric score (0 to 100)
function calculatePasswordScore(whichChecks)
{
    let score = 0;

    if (whichChecks.hasMinLength)
    {
        score = score + 20;
    }

    if (whichChecks.hasUpper)
    {
        score = score + 20;
    }

    if (whichChecks.hasLower)
    {
        score = score + 20;
    }

    if (whichChecks.hasNumber)
    {
        score = score + 20;
    }

    if (whichChecks.hasSymbol)
    {
        score = score + 20;
    }

    return score;
}

// STATION 3: INPUT: numeric score | OUTPUT: strength rating label
function classifyStrength(whichScore)
{
    if (whichScore === 0)
    {
        return 'EMPTY';
    }

    if (whichScore <= 40)
    {
        return 'WEAK';
    }

    if (whichScore <= 60)
    {
        return 'FAIR';
    }

    if (whichScore <= 80)
    {
        return 'STRONG';
    }

    return 'VERY STRONG';
}

// STATION 4: INPUT: score + rating label | OUTPUT: formatted readout string
function formatStrengthReport(whichScore, whichRating)
{
    if (whichScore === 0)
    {
        return 'Score: 0/100 — Enter a password above';
    }

    let report = 'Score: ' + whichScore + '/100 — ' + whichRating;
    return report;
}

//----//

// ===
// INTERFACE LAYER (Explicit Line-by-Line Element Creation)
// ===
function makeInterface()
{
    // Page Title
    let title = ce('div');
    title.textContent = 'Password Strength Scoring Pipeline';
    title.style.fontSize = '24px';
    title.style.marginBottom = '16px';
    ba(title);

    // Input Label
    let passwordLabel = ce('div');
    passwordLabel.textContent = 'Type a Password to Analyze:';
    ba(passwordLabel);

    // Password Text Box
    let passwordInput = ce('input');
    passwordInput.id = 'passwordInput';
    passwordInput.type = 'text';
    passwordInput.value = 'Starfleet1';
    passwordInput.oninput = function()
    {
        runPasswordPipeline();
    };
    ba(passwordInput);

    // Divider Line
    let divider = ce('hr');
    ba(divider);

    // Station 1 Output Box
    let station1Out = ce('div');
    station1Out.id = 'station1Out';
    station1Out.className = 'stationCard';
    ba(station1Out);

    // Station 2 Output Box
    let station2Out = ce('div');
    station2Out.id = 'station2Out';
    station2Out.className = 'stationCard';
    ba(station2Out);

    // Station 3 Output Box
    let station3Out = ce('div');
    station3Out.id = 'station3Out';
    station3Out.className = 'stationCard';
    ba(station3Out);

    // Station 4 Output Box (Final Result)
    let station4Out = ce('div');
    station4Out.id = 'station4Out';
    station4Out.className = 'stationCard';
    ba(station4Out);
}

//----//

// ===
// ORCHESTRATOR
// ===
function runPasswordPipeline()
{
    // 1. Read raw string from the interface
    let rawPassword = ge('passwordInput').value;

    // 2. Run the 4 pure conveyor belt stations
    let ruleChecks = inspectPasswordRules(rawPassword);
    let numericScore = calculatePasswordScore(ruleChecks);
    let strengthRating = classifyStrength(numericScore);
    let finalReport = formatStrengthReport(numericScore, strengthRating);

    // 3. Format Station 1 object flags for clean display
    let checksSummary =
        '8+ Chars: ' + ruleChecks.hasMinLength +
        ' | Upper: ' + ruleChecks.hasUpper +
        ' | Lower: ' + ruleChecks.hasLower +
        ' | Number: ' + ruleChecks.hasNumber +
        ' | Symbol: ' + ruleChecks.hasSymbol;

    // 4. Update each vertical station card using clean textContent
    ge('station1Out').textContent = 'Station 1 (Rule Checks): ' + checksSummary;
    ge('station2Out').textContent = 'Station 2 (Numeric Score): ' + numericScore + ' points';
    ge('station3Out').textContent = 'Station 3 (Rating Tier): ' + strengthRating;
    ge('station4Out').textContent = 'Station 4 (Final Report): ' + finalReport;

    // 5. Color-code Station 4 border based on rating
    let finalCard = ge('station4Out');

    if (numericScore === 100)
    {
        finalCard.style.borderLeftColor = 'rgb(0, 255, 0)';
    }
    else if (numericScore >= 60)
    {
        finalCard.style.borderLeftColor = 'rgb(255, 255, 0)';
    }
    else if (numericScore > 0)
    {
        finalCard.style.borderLeftColor = 'rgb(255, 100, 100)';
    }
    else
    {
        finalCard.style.borderLeftColor = 'rgb(0, 255, 255)';
    }
}

function whenLoaded()
{
    makeInterface();
    runPasswordPipeline();
}

</script>

</head>

<body onload = 'whenLoaded();'>

</body>

</html>

<!--
CONVEYOR BELT DATA FLOW DIAGRAM

  [ Raw Password String: 'Starfleet1' ]
            │
            ▼
  ┌──────────────────────────────────────┐
  │ STATION 1: inspectPasswordRules()    │ ──▶ Output: ruleChecks (Object: 5 Booleans)
  └──────────────────────────────────────┘
            │
            ▼
  ┌──────────────────────────────────────┐
  │ STATION 2: calculatePasswordScore()  │ ──▶ Output: numericScore (Number: 80)
  └──────────────────────────────────────┘
            │
            ▼
  ┌──────────────────────────────────────┐
  │ STATION 3: classifyStrength()        │ ──▶ Output: strengthRating (String: 'STRONG')
  └──────────────────────────────────────┘
            │
            ▼
  ┌──────────────────────────────────────┐
  │ STATION 4: formatStrengthReport()    │ ──▶ Output: finalReport (String: 'Score: 80/100 — STRONG')
  └──────────────────────────────────────┘
-->

<!--
How Data Transforms Across Types on This Belt
Station 1 (String → Object): Separates character inspection from point math so changing how a symbol is detected never breaks the scoring rules.

Station 2 (Object → Number): Converts the five boolean flags into a clean integer (0–100) that can be compared mathematically.

Station 3 (Number → String): Maps numeric thresholds to clear words (WEAK, FAIR, STRONG, VERY STRONG) without needing to know anything about uppercase letters or symbols.

Station 4 (Number + String → String): Assembles the final display banner cleanly before handing it to the DOM.
-->
